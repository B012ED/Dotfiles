[Settings]
language = en
folder = ~/.config/wallpapers
monitors = All
wallpaper = ~/.config/wallpapers/astronaut2.png
show_path_in_tooltip = True
backend = swww
fill = center
sort = name
color = #241F31
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = ~/.config/yusa/yuwaypaper.sh "$wallpaper"
swww_transition_type = center
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 70
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
stylesheet = /usr/share/waypaper/style-dark.css
number_of_columns = 3

